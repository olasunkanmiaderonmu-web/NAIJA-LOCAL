<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"><title>Create New Password | Naija Local</title></head><body>
<div id="site-nav"></div>
<main class="auth-wrap"><div class="container"><div class="row justify-content-center"><div class="col-md-8 col-lg-5">
<div class="auth-card">
 <h1 class="h2">Create a new password</h1>
 <div id="msg" class="alert d-none" role="alert"></div>
 <form id="form" class="d-none" novalidate>
  <div class="mb-3"><label class="form-label" for="password">New password</label>
   <div class="pw-wrap"><input id="password" type="password" class="form-control" autocomplete="new-password" required><button type="button" class="btn-eye" data-toggle-pw="password" aria-label="Show password"><i class="bi bi-eye"></i></button></div>
   <div class="strength mt-2"><div id="bar"></div></div><small id="strengthLabel" class="text-muted-2"></small>
   <div class="invalid-feedback">Use at least 8 characters with a letter and a number.</div></div>
  <div class="mb-3"><label class="form-label" for="confirm">Confirm new password</label>
   <div class="pw-wrap"><input id="confirm" type="password" class="form-control" autocomplete="new-password" required><button type="button" class="btn-eye" data-toggle-pw="confirm" aria-label="Show password"><i class="bi bi-eye"></i></button></div>
   <div class="invalid-feedback">Passwords do not match.</div></div>
  <button id="submit" class="btn btn-market w-100 py-2" type="submit">Save new password</button>
 </form>
 <p id="expired" class="text-muted-2 d-none">This reset link is invalid or has expired. <a href="forgot-password.html">Request a new one</a>.</p>
</div></div></div></div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>
renderNav(); renderFooter(); bindPwToggles(); bindPwStrength($('password'), $('bar'), $('strengthLabel'));
if (ensureConfigured('msg')) {
  let ready = false;
  const open = () => { ready = true; $('form').classList.remove('d-none'); $('expired').classList.add('d-none'); };
  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') open(); });
  setTimeout(() => { if (!ready) $('expired').classList.remove('d-none'); }, 2500);
}
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('password').value, ok = pw.length >= 8 && /[A-Za-z]/.test(pw) && /\d/.test(pw);
  if (![mark($('password'), ok), mark($('confirm'), pw === $('confirm').value)].every(Boolean)) return;
  const btn = $('submit'); setBusy(btn, true, 'Saving...');
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) { setBusy(btn, false); return showAlert('msg', 'danger', friendlyError(error)); }
  await sb.auth.signOut(); $('form').classList.add('d-none');
  showAlert('msg', 'success', 'Password changed. Redirecting you to sign in...');
  setTimeout(() => location.href = 'signin.html', 2000);
});
</script></body></html>
