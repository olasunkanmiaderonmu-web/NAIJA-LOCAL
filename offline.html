<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#14532D">
    <title>You are offline | Naija Local</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #FFF7E8;
            color: #242424;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 1.5rem
        }

        .card {
            max-width: 420px
        }

        .icon {
            width: 84px;
            height: 84px;
            margin: 0 auto 1rem;
            border-radius: 20px;
            background: #14532D;
            display: grid;
            place-items: center;
            color: #FFF7E8;
            font-size: 2.6rem;
            font-weight: 800
        }

        h1 {
            color: #14532D;
            margin: .2rem 0 .5rem
        }

        p {
            color: #737373;
            line-height: 1.5
        }

        button,
        a.b {
            display: inline-block;
            margin: .3rem;
            padding: .7rem 1.4rem;
            border-radius: .75rem;
            border: 0;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none
        }

        button {
            background: #198754;
            color: #fff
        }

        a.b {
            background: #F59E0B;
            color: #242424
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon" aria-hidden="true">N</div>
        <h1>You are offline</h1>
        <p>Naija Local needs the internet to show products near you. Check your data or Wi-Fi, then try again. Pages you
            opened before may still work.</p>
        <button onclick="location.reload()">Try again</button><a class="b" href="index.html">Go to homepage</a>
    </div>
    <script>addEventListener('online', () => location.reload());</script>
</body>

</html>
