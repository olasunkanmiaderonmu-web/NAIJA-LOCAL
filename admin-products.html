<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"><title>Products | Naija Local Admin</title></head><body>
<div id="site-nav"></div>
<main class="container py-4"><div class="row g-4"><div class="col-lg-3" id="sidebar"></div><div class="col-lg-9">
<h1 class="h2 mb-1">Product management</h1><p class="text-muted-2">Suspend or remove listings, fix statuses, and choose up to 8 products to feature on the homepage.</p><div id="msg" class="alert d-none" role="alert"></div>
<div class="row g-2 mb-3"><div class="col-md-6"><label class="visually-hidden" for="q">Search listings</label><input id="q" type="search" class="form-control" placeholder="Search by product name"></div>
<div class="col-md-3"><label class="visually-hidden" for="fs">Status</label><select id="fs" class="form-select"><option value="">All statuses</option><option>active</option><option>draft</option><option>sold</option><option>unavailable</option><option>suspended</option><option>removed</option></select></div>
<div class="col-md-3 d-flex align-items-center"><span class="small text-muted-2" id="featCount"></span></div></div>
<div id="sellerNote" class="alert alert-info d-none"></div>
<div id="list" class="vstack gap-2"></div><div id="status" class="text-center py-3"></div><div class="text-center"><button class="btn btn-outline-success d-none" id="more" type="button">Load more</button></div>
</div></div></main><div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<style>.nav-pills .nav-link{color:var(--forest)}.nav-pills .nav-link.active{background:var(--green);color:#fff}.arow{background:#fff;border:1px solid #f0e6d2;border-radius:1rem;padding:.8rem}</style>
<script>
renderNav(); renderFooter();
const PAGE = 30, STS = ['active', 'draft', 'sold', 'unavailable', 'suspended', 'removed'], BADGE = { active: 'success', draft: 'secondary', sold: 'dark', unavailable: 'warning', suspended: 'danger', removed: 'danger' };
const sellerFilter = new URLSearchParams(location.search).get('seller');
let offset = 0, rows = [], names = {}, feat = new Set(), token = 0;
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
function draw(){
  $('featCount').textContent = `${feat.size} of 8 featured`;
  $('list').innerHTML = rows.map(p => `<div class="arow d-flex flex-wrap gap-3 align-items-center"><img src="${esc(p.primary_image || NO_IMG)}" alt="" width="64" height="64" class="rounded-3" style="object-fit:cover">
   <div class="flex-grow-1" style="min-width:200px"><a class="fw-bold text-decoration-none" href="product.html?id=${p.id}" target="_blank">${esc(p.product_name)}</a> <span class="badge text-bg-${BADGE[p.status]}">${p.status}</span>
    <div class="small text-muted-2">${fmtNaira(p.price)} &middot; ${esc(names[p.seller_id] || 'Seller')} &middot; ${timeAgo(p.created_at)}</div></div>
   <div class="d-flex gap-1 align-items-center"><button class="btn btn-sm ${feat.has(p.id) ? 'btn-gold' : 'btn-outline-secondary'}" data-f="${p.id}" aria-pressed="${feat.has(p.id)}" title="Feature on homepage"><i class="bi bi-star${feat.has(p.id) ? '-fill' : ''}"></i></button>
   <select class="form-select form-select-sm" data-st="${p.id}" aria-label="Change status">${STS.map(s => `<option ${s === p.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div></div>`).join('');
}
async function load(reset){
  if (reset) { offset = 0; rows = []; token++; } const mine = token;
  $('status').innerHTML = '<div class="spinner-border text-success" role="status"></div>';
  let qb = sb.from('products').select('id,product_name,price,status,primary_image,seller_id,created_at').order('created_at', { ascending: false }).range(offset, offset + PAGE - 1);
  const q = $('q').value.trim().replace(/[%_,()]/g, ''); if (q) qb = qb.ilike('product_name', `%${q}%`);
  if ($('fs').value) qb = qb.eq('status', $('fs').value); if (sellerFilter) qb = qb.eq('seller_id', sellerFilter);
  const { data, error } = await qb; if (mine !== token) return; $('status').innerHTML = '';
  if (error) return showAlert('msg', 'danger', friendlyError(error));
  const need = [...new Set(data.map(p => p.seller_id))].filter(i => !names[i]);
  if (need.length) { const { data: pr } = await sb.from('profiles').select('id,full_name').in('id', need); (pr || []).forEach(x => names[x.id] = x.full_name); }
  rows = rows.concat(data); offset += data.length; $('more').classList.toggle('d-none', data.length < PAGE);
  if (!rows.length) $('status').innerHTML = '<p class="text-muted-2">No listings match.</p>'; draw();
}
$('list').addEventListener('change', async e => {
  const sel = e.target.closest('[data-st]'); if (!sel) return; const p = rows.find(x => x.id === sel.dataset.st), to = sel.value;
  if (['suspended', 'removed'].includes(to) && !await confirmBox(`Set to ${to}?`, `"${p.product_name}" will be hidden from buyers and the seller will be notified.`, 'Confirm')) { sel.value = p.status; return; }
  const { error } = await sb.from('products').update({ status: to }).eq('id', p.id);
  if (error) { sel.value = p.status; return showAlert('msg', 'danger', error.message.includes('active_needs_location') ? 'That listing is missing a location, WhatsApp number or category, so it cannot be set to active.' : friendlyError(error)); }
  p.status = to; draw();
});
$('list').addEventListener('click', async e => {
  const b = e.target.closest('[data-f]'); if (!b) return; const id = b.dataset.f;
  const { error } = feat.has(id) ? await sb.from('featured_products').delete().eq('product_id', id) : await sb.from('featured_products').insert({ product_id: id, position: feat.size });
  if (error) return showAlert('msg', 'danger', friendlyError(error)); feat.has(id) ? feat.delete(id) : feat.add(id); draw();
});
$('more').onclick = () => load(false); $('fs').addEventListener('change', () => load(true)); $('q').addEventListener('input', debounce(() => load(true), 400));
(async () => {
  if (!ensureConfigured('msg')) return; const s = await requireAdmin(); if (!s) return; renderAdminSidebar('admin-products.html');
  if (sellerFilter) { $('sellerNote').classList.remove('d-none'); $('sellerNote').innerHTML = 'Showing one seller\'s listings. <a href="admin-products.html">Show all</a>'; }
  const { data } = await sb.from('featured_products').select('product_id'); (data || []).forEach(f => feat.add(f.product_id)); load(true);
})();
</script></body></html>
