<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"><title>Enquiries | Naija Local</title></head><body>
<div id="site-nav"></div>
<main class="container py-4"><div class="row g-4"><div class="col-lg-3" id="sidebar"></div>
<div class="col-lg-9"><h1 class="h2 mb-1">Enquiries</h1><p class="text-muted-2">Offers sent through Naija Local, and contact buttons buyers tapped. Chats on WhatsApp or email happen outside the platform, so we cannot see them.</p>
<div id="msg" class="alert d-none" role="alert"></div>
<ul class="nav nav-pills mb-3" id="tabs"><li class="nav-item"><button class="nav-link active" data-t="offers">Offers <span class="badge text-bg-light" id="nO">0</span></button></li><li class="nav-item"><button class="nav-link" data-t="taps">Contact taps <span class="badge text-bg-light" id="nT">0</span></button></li></ul>
<div id="list" class="vstack gap-2"></div></div></div></main><div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<style>.nav-pills .nav-link{color:var(--forest)}.nav-pills .nav-link.active{background:var(--green);color:#fff}</style>
<script>
renderNav(); renderFooter(); renderSidebar('enquiries.html');
let offers = [], taps = [], names = {}, tab = 'offers';
const ST = { pending: 'warning', seen: 'secondary', accepted: 'success', declined: 'danger' };
const who = id => esc(names[id] || 'A buyer');
function draw(){
  document.querySelectorAll('#tabs .nav-link').forEach(b => b.classList.toggle('active', b.dataset.t === tab));
  const empty = '<div class="text-center py-5 text-muted-2"><i class="bi bi-chat-dots fs-1"></i><p class="mb-0">Nothing here yet.</p></div>';
  if (tab === 'offers') $('list').innerHTML = offers.length ? offers.map(o => `<div class="auth-card" style="padding:1rem"><div class="d-flex flex-wrap justify-content-between gap-2">
    <div><strong>${who(o.buyer_id)}</strong> offered <strong>${fmtNaira(o.proposed_price)}</strong> for <a href="product.html?id=${o.products ? o.products.id : ''}">${esc(o.products ? o.products.product_name : 'a product')}</a>
    <div class="small text-muted-2">Listed at ${o.products ? fmtNaira(o.products.price) : '-'} &middot; ${timeAgo(o.created_at)}</div>${o.message ? `<div class="mt-1">"${esc(o.message)}"</div>` : ''}</div>
    <div class="text-end"><span class="badge text-bg-${ST[o.status]}">${o.status}</span>
    <div class="d-flex gap-1 mt-2 justify-content-end flex-wrap">${['seen', 'accepted', 'declined'].filter(x => x !== o.status).map(x => `<button class="btn btn-sm btn-outline-success" data-id="${o.id}" data-s="${x}">${x === 'seen' ? 'Mark seen' : x === 'accepted' ? 'Accept' : 'Decline'}</button>`).join('')}</div></div></div></div>`).join('') + '<p class="small text-muted-2">Accepting only records your answer. Mark the product as sold yourself once the deal is done. Buyers usually reach you on WhatsApp or email.</p>' : empty;
  else $('list').innerHTML = taps.length ? taps.map(t => `<div class="auth-card" style="padding:.9rem"><strong>${who(t.buyer_id)}</strong> tapped <strong>${t.contact_method}</strong> on <a href="product.html?id=${t.products ? t.products.id : ''}">${esc(t.products ? t.products.product_name : 'a product')}</a> <span class="small text-muted-2">&middot; ${timeAgo(t.created_at)}</span></div>`).join('') : empty;
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) { tab = b.dataset.t; draw(); } });
$('list').addEventListener('click', async e => {
  const b = e.target.closest('[data-s]'); if (!b) return;
  const { error } = await sb.from('offers').update({ status: b.dataset.s }).eq('id', b.dataset.id);
  if (error) return showAlert('msg', 'danger', friendlyError(error)); offers.find(o => o.id === b.dataset.id).status = b.dataset.s; draw();
});
(async () => {
  if (!ensureConfigured('msg')) return; const s = await requireAuth(); if (!s) return;
  const [o, t] = await Promise.all([
    sb.from('offers').select('id,proposed_price,message,status,created_at,buyer_id,products(id,product_name,price)').eq('seller_id', s.user.id).order('created_at', { ascending: false }).limit(100),
    sb.from('inquiries').select('id,contact_method,created_at,buyer_id,products(id,product_name)').eq('seller_id', s.user.id).neq('contact_method', 'offer').order('created_at', { ascending: false }).limit(100)]);
  if (o.error || t.error) return showAlert('msg', 'danger', friendlyError(o.error || t.error));
  offers = o.data || []; taps = t.data || [];
  const ids = [...new Set([...offers, ...taps].map(x => x.buyer_id))];
  if (ids.length) { const { data } = await sb.from('public_profiles').select('id,full_name').in('id', ids); (data || []).forEach(p => names[p.id] = p.full_name); }
  $('nO').textContent = offers.length; $('nT').textContent = taps.length; draw();
})();
</script></body></html>
