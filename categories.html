<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"><title>Categories | Naija Local</title></head><body>
<div id="site-nav"></div>
<main class="container py-4"><h1 class="h2 mb-1">Product categories</h1><p class="text-muted-2 mb-4">Pick a category to see what is for sale around you.</p>
<div id="msg" class="alert d-none" role="alert"></div><div class="row g-3" id="grid"></div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>
renderNav('categories.html'); renderFooter();
const draw = list => $('grid').innerHTML = list.map(c => `<div class="col-6 col-md-4 col-lg-3">${categoryCard(c)}</div>`).join('');
(async () => {
  if (!CONFIGURED) return draw(CATEGORY_META.map(c => ({ slug: c[0], name: c[2] })));
  const { data, error } = await sb.from('categories').select('name,slug').eq('is_active', true).order('name');
  if (error) return showAlert('msg', 'danger', friendlyError(error));
  draw(data);
})();
</script></body></html>
