<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"><title>Sign In | Naija Local</title></head><body>
<div id="site-nav"></div>
<main class="auth-wrap"><div class="container"><div class="row justify-content-center"><div class="col-md-8 col-lg-5">
<div class="auth-card">
 <h1 class="h2">Welcome back</h1><p class="text-muted-2">Sign in to buy, sell and manage your listings.</p>
 <div id="msg" class="alert d-none" role="alert"></div>
 <form id="form" novalidate>
  <div class="mb-3"><label class="form-label" for="email">Email address</label><input id="email" type="email" class="form-control" autocomplete="email" required><div class="invalid-feedback">Enter your email address.</div></div>
  <div class="mb-3"><label class="form-label" for="password">Password</label>
   <div class="pw-wrap"><input id="password" type="password" class="form-control" autocomplete="current-password" required><button type="button" class="btn-eye" data-toggle-pw="password" aria-label="Show password"><i class="bi bi-eye"></i></button></div>
   <div class="invalid-feedback">Enter your password.</div></div>
  <div class="d-flex justify-content-between mb-3"><div class="form-check"><input class="form-check-input" type="checkbox" id="remember" checked><label class="form-check-label" for="remember">Remember me</label></div><a href="forgot-password.html">Forgot password?</a></div>
  <button id="submit" class="btn btn-market w-100 py-2" type="submit">Sign in</button>
 </form>
 <p class="text-center mt-3 mb-0">New here? <a href="signup.html">Create an account</a></p>
</div></div></div></div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>
renderNav(); renderFooter(); bindPwToggles();
const params = new URLSearchParams(location.search);
if (location.hash.includes('type=signup')) showAlert('msg', 'success', 'Email verified. Sign in to continue.');
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  if (!ensureConfigured('msg')) return;
  const email = $('email').value.trim(), pw = $('password').value;
  if (![mark($('email'), /^\S+@\S+\.\S+$/.test(email)), mark($('password'), !!pw)].every(Boolean)) return;
  localStorage.setItem('nl_remember', $('remember').checked ? '1' : '0');
  const btn = $('submit'); setBusy(btn, true, 'Signing in...');
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (error) { setBusy(btn, false); return showAlert('msg', 'danger', friendlyError(error)); }
  const { data: p } = await sb.from('profiles').select('is_suspended').eq('id', data.user.id).maybeSingle();
  if (p && p.is_suspended) { await sb.auth.signOut(); setBusy(btn, false); return showAlert('msg', 'danger', 'This account is suspended. Contact support if you think this is a mistake.'); }
  const next = params.get('next'); location.href = next && /^[a-z0-9-]+\.html(\?[a-z0-9=&%._-]*)?$/i.test(next) ? next : 'profile.html';
});
</script></body></html>
