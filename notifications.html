<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"><title>Notifications | Naija Local</title></head><body>
<div id="site-nav"></div>
<main class="container py-4" style="max-width:760px"><div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h2 mb-0">Notifications</h1><button class="btn btn-outline-success btn-sm" id="all" type="button">Mark all as read</button></div>
<div id="msg" class="alert d-none" role="alert"></div><div id="list" class="vstack gap-2"></div>
<div id="empty" class="text-center py-5 d-none text-muted-2"><i class="bi bi-bell fs-1"></i><p>No notifications yet.</p></div></main><div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>
renderNav(); renderFooter(); let uid, rows = [];
function draw(){
  $('empty').classList.toggle('d-none', rows.length > 0);
  $('list').innerHTML = rows.map(n => `<div class="auth-card d-flex gap-3 align-items-start" style="padding:1rem;${n.is_read ? 'opacity:.7' : 'border-left:5px solid var(--gold)'}">
   <i class="bi bi-bell${n.is_read ? '' : '-fill text-warning'} fs-5"></i><div class="flex-grow-1"><strong>${esc(n.title)}</strong><div>${esc(n.message)}</div><div class="small text-muted-2">${timeAgo(n.created_at)}</div></div>
   ${n.is_read ? '' : `<button class="btn btn-sm btn-outline-success" data-id="${n.id}">Mark read</button>`}</div>`).join('');
}
$('list').addEventListener('click', async e => { const b = e.target.closest('[data-id]'); if (!b) return;
  const { error } = await sb.from('notifications').update({ is_read: true }).eq('id', b.dataset.id); if (error) return showAlert('msg', 'danger', friendlyError(error));
  rows.find(n => n.id === b.dataset.id).is_read = true; draw(); });
$('all').onclick = async () => { const { error } = await sb.from('notifications').update({ is_read: true }).eq('user_id', uid).eq('is_read', false); if (error) return showAlert('msg', 'danger', friendlyError(error)); rows.forEach(n => n.is_read = true); draw(); };
(async () => {
  if (!ensureConfigured('msg')) return; const s = await requireAuth(); if (!s) return; uid = s.user.id;
  const { data, error } = await sb.from('notifications').select('id,title,message,is_read,created_at').order('created_at', { ascending: false }).limit(100);
  if (error) return showAlert('msg', 'danger', friendlyError(error)); rows = data || []; draw();
})();
</script></body></html>
