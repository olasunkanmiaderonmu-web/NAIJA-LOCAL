<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"><title>My Products | Naija Local</title></head><body>
<div id="site-nav"></div>
<main class="container py-4">
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><h1 class="h2 mb-0">My products</h1><a href="add-product.html" class="btn btn-gold"><i class="bi bi-plus-lg"></i> Add new product</a></div>
<div id="msg" class="alert d-none" role="alert"></div>
<div class="row g-2 mb-3"><div class="col-md-8"><ul class="nav nav-pills" id="tabs">
 <li class="nav-item"><button class="nav-link" data-s="all">All</button></li><li class="nav-item"><button class="nav-link" data-s="active">Active</button></li>
 <li class="nav-item"><button class="nav-link" data-s="draft">Drafts</button></li><li class="nav-item"><button class="nav-link" data-s="sold">Sold</button></li><li class="nav-item"><button class="nav-link" data-s="unavailable">Unavailable</button></li></ul></div>
 <div class="col-md-4"><label class="visually-hidden" for="q">Search my products</label><input id="q" type="search" class="form-control" placeholder="Search my products"></div></div>
<div id="list" class="vstack gap-2" aria-live="polite"></div>
<div id="empty" class="text-center py-5 d-none"><i class="bi bi-box-seam fs-1 text-muted-2"></i><p class="fw-bold mb-1">Nothing here yet.</p><a href="add-product.html" class="btn btn-market">Add your first product</a></div>
</main><div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<style>.nav-pills .nav-link{color:var(--forest)}.nav-pills .nav-link.active{background:var(--green)}.prow{background:#fff;border:1px solid #f0e6d2;border-radius:1rem;padding:.75rem}.prow img{width:84px;height:84px;object-fit:cover;border-radius:.75rem}</style>
<script>
renderNav(); renderFooter();
const BADGE = { active: 'success', draft: 'secondary', sold: 'dark', unavailable: 'warning', suspended: 'danger', removed: 'danger' };
let uid, rows = [], views = {}, tab = new URLSearchParams(location.search).get('status') || 'all';
function draw(){
  const q = $('q').value.trim().toLowerCase();
  document.querySelectorAll('#tabs .nav-link').forEach(b => b.classList.toggle('active', b.dataset.s === tab));
  const list = rows.filter(r => (tab === 'all' || r.status === tab) && r.product_name.toLowerCase().includes(q));
  $('empty').classList.toggle('d-none', list.length > 0);
  $('list').innerHTML = list.map(r => {
    const locked = ['suspended', 'removed'].includes(r.status);
    return `<div class="prow d-flex flex-wrap gap-3 align-items-center"><img src="${esc(r.primary_image || NO_IMG)}" alt="">
     <div class="flex-grow-1" style="min-width:200px"><a class="fw-bold text-decoration-none" href="product.html?id=${r.id}">${esc(r.product_name)}</a>
      <div class="price fs-6">${fmtNaira(r.price)}</div>
      <div class="small text-muted-2">${esc((r.categories && r.categories.name) || 'No category')} &middot; Listed ${timeAgo(r.created_at)} &middot; ${views[r.id] || 0} views</div></div>
     <span class="badge text-bg-${BADGE[r.status]}">${r.status}</span>
     <div class="d-flex flex-wrap gap-1">${locked ? '<span class="small text-muted-2">Locked by admin</span>' : `
      <a class="btn btn-sm btn-outline-success" href="add-product.html?id=${r.id}">Edit</a>
      ${r.status === 'draft' ? `<button class="btn btn-sm btn-market" data-act="publish" data-id="${r.id}">Publish</button>` : ''}
      ${r.status === 'active' ? `<button class="btn btn-sm btn-gold" data-act="sold" data-id="${r.id}">Mark sold</button><button class="btn btn-sm btn-outline-secondary" data-act="unavailable" data-id="${r.id}">Unavailable</button>` : ''}
      ${['sold', 'unavailable'].includes(r.status) ? `<button class="btn btn-sm btn-market" data-act="relist" data-id="${r.id}">Relist</button>` : ''}
      <button class="btn btn-sm btn-outline-danger" data-act="delete" data-id="${r.id}" aria-label="Delete"><i class="bi bi-trash"></i></button>`}</div></div>`;
  }).join('');
}
async function load(){
  const { data, error } = await sb.from('products').select('id,product_name,price,status,primary_image,created_at,categories(name)').eq('seller_id', uid).order('created_at', { ascending: false });
  if (error) return showAlert('msg', 'danger', friendlyError(error));
  rows = data || [];
  if (rows.length) { const { data: v } = await sb.from('product_views').select('product_id').in('product_id', rows.map(r => r.id)); views = {}; (v || []).forEach(x => views[x.product_id] = (views[x.product_id] || 0) + 1); }
  draw();
}
async function setStatus(id, status){ const { error } = await sb.from('products').update({ status }).eq('id', id); if (error) return showAlert('msg', 'danger', error.message.includes('active_needs_location') ? 'Complete the location, WhatsApp number and category first. Press Edit.' : friendlyError(error)); await load(); }
$('list').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const id = b.dataset.id, act = b.dataset.act, r = rows.find(x => x.id === id);
  if (act === 'sold') { if (await confirmBox('Mark as sold?', `"${r.product_name}" will leave the marketplace and move to Sold.`, 'Mark as sold')) setStatus(id, 'sold'); }
  else if (act === 'unavailable') setStatus(id, 'unavailable');
  else if (act === 'publish' || act === 'relist') setStatus(id, 'active');
  else if (act === 'delete') {
    if (!await confirmBox('Delete this product?', `"${r.product_name}" and its photos will be permanently removed. This cannot be undone.`, 'Delete')) return;
    const { data: files } = await sb.storage.from('product-images').list(uid + '/' + id);
    if (files && files.length) await sb.storage.from('product-images').remove(files.map(f => `${uid}/${id}/${f.name}`));
    const { error } = await sb.from('products').delete().eq('id', id); if (error) return showAlert('msg', 'danger', friendlyError(error)); load();
  }
});
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (b) { tab = b.dataset.s; draw(); } });
$('q').addEventListener('input', draw);
(async () => { if (!ensureConfigured('msg')) return; const s = await requireAuth(); if (!s) return; uid = s.user.id; load(); })();
</script></body></html>
