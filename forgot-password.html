<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"><title>Forgot Password | Naija Local</title></head><body>
<div id="site-nav"></div>
<main class="auth-wrap"><div class="container"><div class="row justify-content-center"><div class="col-md-8 col-lg-5">
<div class="auth-card">
 <h1 class="h2">Reset your password</h1><p class="text-muted-2">Enter your registered email and we will send you a reset link.</p>
 <div id="msg" class="alert d-none" role="alert"></div>
 <form id="form" novalidate>
  <div class="mb-3"><label class="form-label" for="email">Email address</label><input id="email" type="email" class="form-control" autocomplete="email" required><div class="invalid-feedback">Enter a valid email address.</div></div>
  <button id="submit" class="btn btn-market w-100 py-2" type="submit">Send reset link</button>
 </form>
 <p class="text-center mt-3 mb-0"><a href="signin.html">Back to sign in</a></p>
</div></div></div></div></main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>
renderNav(); renderFooter();
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  if (!ensureConfigured('msg')) return;
  const email = $('email').value.trim();
  if (!mark($('email'), /^\S+@\S+\.\S+$/.test(email))) return;
  const btn = $('submit'); setBusy(btn, true, 'Sending...');
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname.replace('forgot-password.html', 'reset-password.html') });
  setBusy(btn, false);
  if (error) return showAlert('msg', 'danger', friendlyError(error));
  showAlert('msg', 'success', 'If that email has an account, a reset link is on its way. Check your inbox and spam folder.');
});
</script></body></html>
