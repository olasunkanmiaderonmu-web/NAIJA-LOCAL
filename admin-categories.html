<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"><title>Categories | Naija Local Admin</title></head><body>
<div id="site-nav"></div>
<main class="container py-4"><div class="row g-4"><div class="col-lg-3" id="sidebar"></div><div class="col-lg-9">
<h1 class="h2 mb-3">Category management</h1><div id="msg" class="alert d-none" role="alert"></div>
<form id="form" class="auth-card mb-4" style="padding:1.25rem" novalidate><h2 class="h5" id="formTitle">Add a category</h2><div class="row g-3">
 <div class="col-md-5"><label class="form-label" for="name">Name</label><input id="name" class="form-control" maxlength="60" required><div class="invalid-feedback">Enter a name.</div></div>
 <div class="col-md-7"><label class="form-label" for="desc">Description (optional)</label><input id="desc" class="form-control" maxlength="200"></div>
 <div class="col-12"><button class="btn btn-market" id="save" type="submit">Add category</button> <button class="btn btn-outline-secondary d-none" id="cancel" type="button">Cancel edit</button></div></div></form>
<div id="list" class="vstack gap-2"></div>
</div></div></main><div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<style>.nav-pills .nav-link{color:var(--forest)}.nav-pills .nav-link.active{background:var(--green);color:#fff}.arow{background:#fff;border:1px solid #f0e6d2;border-radius:1rem;padding:.8rem}</style>
<script>
renderNav(); renderFooter();
let cats = [], editId = null;
const slugify = s => s.toLowerCase().replace(/&/g, 'and').replace(/'/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function draw(){
  $('list').innerHTML = cats.map(c => `<div class="arow d-flex flex-wrap gap-2 align-items-center"><i class="bi bi-${catIcon(c.slug)} fs-4 text-success"></i>
   <div class="flex-grow-1"><strong>${esc(c.name)}</strong> ${c.is_active ? '' : '<span class="badge text-bg-secondary">hidden</span>'}<div class="small text-muted-2">${esc(c.slug)}${c.description ? ' &middot; ' + esc(c.description) : ''}</div></div>
   <div class="d-flex gap-1"><button class="btn btn-sm btn-outline-success" data-e="${c.id}">Edit</button>
   <button class="btn btn-sm btn-outline-secondary" data-t="${c.id}">${c.is_active ? 'Hide' : 'Show'}</button><button class="btn btn-sm btn-outline-danger" data-d="${c.id}" aria-label="Delete ${esc(c.name)}"><i class="bi bi-trash"></i></button></div></div>`).join('');
}
async function load(){ const { data, error } = await sb.from('categories').select('id,name,slug,description,is_active').order('name'); if (error) return showAlert('msg', 'danger', friendlyError(error)); cats = data || []; draw(); }
function resetForm(){ editId = null; $('form').reset(); $('name').classList.remove('is-invalid'); $('formTitle').textContent = 'Add a category'; $('save').textContent = 'Add category'; $('cancel').classList.add('d-none'); }
$('cancel').onclick = resetForm;
$('form').addEventListener('submit', async e => {
  e.preventDefault(); const name = $('name').value.trim(); if (!mark($('name'), name.length >= 2)) return;
  const row = { name, description: $('desc').value.trim() || null };
  const { error } = editId ? await sb.from('categories').update(row).eq('id', editId) : await sb.from('categories').insert({ ...row, slug: slugify(name) });
  if (error) return showAlert('msg', 'danger', error.code === '23505' ? 'A category with that name already exists.' : friendlyError(error));
  showAlert('msg', 'success', editId ? 'Category updated.' : 'Category added.'); resetForm(); load();
});
$('list').addEventListener('click', async e => {
  const ed = e.target.closest('[data-e]'), tg = e.target.closest('[data-t]'), dl = e.target.closest('[data-d]');
  if (ed) { const c = cats.find(x => x.id === ed.dataset.e); editId = c.id; $('name').value = c.name; $('desc').value = c.description || ''; $('formTitle').textContent = 'Edit category'; $('save').textContent = 'Save changes'; $('cancel').classList.remove('d-none'); $('name').focus(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  if (tg) { const c = cats.find(x => x.id === tg.dataset.t); const { error } = await sb.from('categories').update({ is_active: !c.is_active }).eq('id', c.id); if (error) return showAlert('msg', 'danger', friendlyError(error)); load(); }
  if (dl) {
    const c = cats.find(x => x.id === dl.dataset.d);
    const { count } = await sb.from('products').select('id', { count: 'exact', head: true }).eq('category_id', c.id);
    if (count) return showAlert('msg', 'warning', `"${c.name}" has ${count} product${count > 1 ? 's' : ''}. Hide it instead of deleting so those listings stay valid.`);
    if (!await confirmBox('Delete this category?', `"${c.name}" will be removed permanently.`, 'Delete')) return;
    const { error } = await sb.from('categories').delete().eq('id', c.id); if (error) return showAlert('msg', 'danger', friendlyError(error)); load();
  }
});
(async () => { if (!ensureConfigured('msg')) return; const s = await requireAdmin(); if (!s) return; renderAdminSidebar('admin-categories.html'); load(); })();
</script></body></html>
