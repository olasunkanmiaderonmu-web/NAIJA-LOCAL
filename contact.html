<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><script>try{var _k=[].concat(Object.keys(localStorage),Object.keys(sessionStorage));if(_k.some(function(x){return /^sb-.+-auth-token$/.test(x)}))document.documentElement.className+=' has-session'}catch(e){}</script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14532D"><link rel="icon" href="icons/icon.svg" type="image/svg+xml"><link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Naija Local"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Get in touch with the Naija Local team.">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"><title>Contact Us | Naija Local</title></head><body>
<div id="site-nav"></div>
<main class="container py-4" style="max-width:860px"><div class="auth-card">

<h1>Contact us</h1><p class="text-muted-2">Questions, feedback or a problem with a listing? Write your message and send it the way you prefer.</p>
<div id="msg" class="alert d-none" role="alert"></div>
<form id="form" novalidate><div class="row g-3">
 <div class="col-md-6"><label class="form-label" for="name">Your name</label><input id="name" class="form-control" required><div class="invalid-feedback">Enter your name.</div></div>
 <div class="col-md-6"><label class="form-label" for="email">Your email</label><input id="email" type="email" class="form-control" required><div class="invalid-feedback">Enter a valid email.</div></div>
 <div class="col-12"><label class="form-label" for="subject">Subject</label><input id="subject" class="form-control" required><div class="invalid-feedback">Enter a subject.</div></div>
 <div class="col-12"><label class="form-label" for="message">Message</label><textarea id="message" class="form-control" rows="5" required></textarea><div class="invalid-feedback">Write your message.</div></div>
 <div class="col-12 d-flex flex-wrap gap-2"><button class="btn btn-market" id="wa" type="button"><i class="bi bi-whatsapp"></i> Send on WhatsApp</button><button class="btn btn-outline-success" id="mail" type="button"><i class="bi bi-envelope"></i> Send by email</button></div>
</div></form>
<hr class="my-4"><h2 class="h5 mb-3">Reach us directly</h2><div class="row g-3" id="details"><div class="col-12 text-muted-2">Loading contact details...</div></div>
</div></main><div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>renderNav('contact.html'); renderFooter();</script>
<script>
let C = { wa: '', em: '' };
(async () => {
  if (CONFIGURED) { const { data } = await sb.from('platform_settings').select('key,value'); (data || []).forEach(r => { if (r.key === 'contact_whatsapp') C.wa = r.value; if (r.key === 'contact_email') C.em = r.value; }); }
  const fmt = n => n.replace(/^\+234(\d{3})(\d{3})(\d{4})$/, '+234 $1 $2 $3');
  const cards = [];
  if (C.wa) cards.push(`<div class="col-md-6"><div class="contact-card wa"><span class="cc-icon"><i class="bi bi-whatsapp"></i></span>
    <div class="cc-body"><div class="cc-label">WhatsApp</div><div class="cc-value">${esc(fmt(C.wa))}</div><div class="cc-sub">Chat with us directly</div></div>
    <div class="cc-actions"><a class="btn btn-light btn-sm fw-bold" target="_blank" rel="noopener" href="${esc(waLink(C.wa, 'Hello Naija Local, '))}"><i class="bi bi-chat-dots-fill"></i> Chat now</a><button class="btn btn-outline-light btn-sm" type="button" data-copy="${esc(C.wa)}"><i class="bi bi-clipboard"></i> Copy number</button></div></div></div>`);
  if (C.em) cards.push(`<div class="col-md-6"><div class="contact-card mail"><span class="cc-icon"><i class="bi bi-envelope-paper-fill"></i></span>
    <div class="cc-body"><div class="cc-label">Email</div><div class="cc-value">${esc(C.em)}</div><div class="cc-sub">Write to us any time</div></div>
    <div class="cc-actions"><a class="btn btn-dark btn-sm fw-bold" href="mailto:${esc(C.em)}"><i class="bi bi-send-fill"></i> Send email</a><button class="btn btn-outline-light btn-sm" type="button" data-copy="${esc(C.em)}"><i class="bi bi-clipboard"></i> Copy email</button></div></div></div>`);
  $('details').innerHTML = cards.length ? cards.join('') : '<div class="col-12"><div class="contact-empty"><i class="bi bi-chat-heart"></i><p class="fw-bold mb-1 mt-2">Contact details coming soon</p><p class="mb-0 small">Use the form above in the meantime, or check back shortly.</p></div></div>';
})();
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); const old = b.innerHTML; b.innerHTML = '<i class="bi bi-check2"></i> Copied'; setTimeout(() => b.innerHTML = old, 1600); } catch (err) {}
});
function read(){
  const d = { name: $('name').value.trim(), email: $('email').value.trim(), subject: $('subject').value.trim(), message: $('message').value.trim() };
  const ok = [mark($('name'), d.name.length >= 2), mark($('email'), /^\S+@\S+\.\S+$/.test(d.email)), mark($('subject'), d.subject.length >= 3), mark($('message'), d.message.length >= 5)];
  return ok.includes(false) ? null : d;
}
const text = d => `${d.subject}\n\n${d.message}\n\nFrom: ${d.name} (${d.email})`;
$('wa').onclick = () => { const d = read(); if (!d) return; if (!C.wa) return showAlert('msg', 'warning', 'No WhatsApp number has been set up yet. Try email.'); window.open(waLink(C.wa, text(d)), '_blank', 'noopener'); };
$('mail').onclick = () => { const d = read(); if (!d) return; if (!C.em) return showAlert('msg', 'warning', 'No contact email has been set up yet. Try WhatsApp.'); location.href = 'mailto:' + C.em + '?subject=' + encodeURIComponent(d.subject) + '&body=' + encodeURIComponent(text(d)); };
</script>
</body></html>
