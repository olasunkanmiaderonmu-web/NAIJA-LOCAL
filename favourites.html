<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"><title>My Favourites | Naija Local</title></head><body>
<div id="site-nav"></div>
<main class="container py-4"><h1 class="h2 mb-3">My favourites</h1><div id="msg" class="alert d-none" role="alert"></div>
<div class="row g-3" id="grid"></div>
<div id="empty" class="text-center py-5 d-none"><i class="bi bi-heart fs-1 text-muted-2"></i><p class="fw-bold mb-1">No favourites yet.</p><p class="text-muted-2">Tap the heart on any product to save it here.</p><a class="btn btn-market" href="explore.html">Explore products</a></div>
</main><div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>
renderNav(); renderFooter();
(async () => {
  if (!ensureConfigured('msg')) return; const s = await requireAuth(); if (!s) return;
  const { data, error } = await sb.from('favourites').select('product_id,created_at,products(id,product_name,price,primary_image,public_location,status,negotiable,condition)').order('created_at', { ascending: false });
  if (error) return showAlert('msg', 'danger', friendlyError(error));
  const list = (data || []).filter(f => f.products);
  $('empty').classList.toggle('d-none', list.length > 0);
  $('grid').innerHTML = list.map(f => `<div class="col-6 col-md-4 col-lg-3" data-fav-item>${productCard(f.products)}</div>`).join('');
  new MutationObserver(() => $('empty').classList.toggle('d-none', !!$('grid').children.length)).observe($('grid'), { childList: true });
})();
</script></body></html>
