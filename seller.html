<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"><title id="pt">Seller | Naija Local</title></head><body>
<div id="site-nav"></div>
<main class="container py-4"><div id="msg" class="alert d-none" role="alert"></div>
<div id="view" class="d-none"><div class="auth-card d-flex flex-wrap align-items-center gap-3 mb-4"><img id="av" class="avatar-lg" alt="">
 <div><h1 class="h3 mb-1" id="name"></h1><div class="text-muted-2" id="meta"></div><div class="mt-1"><span class="badge text-bg-success" id="soldB"></span> <span class="badge text-bg-warning" id="actB"></span></div></div></div>
 <h2 class="h4 mb-3">Listings</h2><div class="row g-3" id="grid"></div>
 <div id="empty" class="text-muted-2 d-none">This seller has no active listings right now.</div></div>
</main><div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>
renderNav(); renderFooter();
const sid = new URLSearchParams(location.search).get('id');
(async () => {
  if (!ensureConfigured('msg')) return;
  if (!/^[0-9a-f-]{36}$/i.test(sid || '')) return showAlert('msg', 'warning', 'Seller not found.');
  const { data: s } = await sb.from('public_profiles').select('full_name,profile_image,state,created_at').eq('id', sid).maybeSingle();
  if (!s) return showAlert('msg', 'warning', 'Seller not found.');
  const [{ data: prods }, sold] = await Promise.all([
    sb.from('products').select(PRODUCT_COLS).eq('seller_id', sid).eq('status', 'active').order('created_at', { ascending: false }),
    sb.from('products').select('id', { count: 'exact', head: true }).eq('seller_id', sid).eq('status', 'sold')]);
  document.title = s.full_name + ' | Naija Local';
  $('name').textContent = s.full_name; $('av').src = s.profile_image || NO_IMG; $('av').alt = s.full_name;
  $('meta').textContent = (s.state ? s.state + ' · ' : '') + 'Member since ' + new Date(s.created_at).toLocaleDateString('en-NG', { year: 'numeric', month: 'long' });
  $('soldB').textContent = (sold.count || 0) + ' sold'; $('actB').textContent = (prods || []).length + ' active';
  $('grid').innerHTML = (prods || []).map(p => `<div class="col-6 col-md-4 col-lg-3">${productCard({ ...p, seller_name: s.full_name })}</div>`).join('');
  $('empty').classList.toggle('d-none', !!(prods || []).length); $('view').classList.remove('d-none');
})();
</script></body></html>
