<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"><title>Admin Dashboard | Naija Local Admin</title></head><body>
<div id="site-nav"></div>
<main class="container py-4"><div class="row g-4"><div class="col-lg-3" id="sidebar"></div><div class="col-lg-9">
<h1 class="h2 mb-3">Admin dashboard</h1><div id="msg" class="alert d-none" role="alert"></div>
<div class="row g-3" id="cards"></div>
<div class="row g-3 mt-1"><div class="col-lg-6"><div class="chart-card"><div class="d-flex justify-content-between"><h2 class="h6">Open reports</h2><a href="admin-reports.html" class="small">View all</a></div><div id="rep" class="vstack gap-2"></div></div></div>
<div class="col-lg-6"><div class="chart-card"><div class="d-flex justify-content-between"><h2 class="h6">Newest members</h2><a href="admin-users.html" class="small">View all</a></div><div id="usr" class="vstack gap-2"></div></div></div></div>
</div></div></main><div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<style>.nav-pills .nav-link{color:var(--forest)}.nav-pills .nav-link.active{background:var(--green);color:#fff}.arow{background:#fff;border:1px solid #f0e6d2;border-radius:1rem;padding:.8rem}</style>
<script>
renderNav(); renderFooter(); renderAdminSidebar('admin.html');
(async () => {
  if (!ensureConfigured('msg')) return; const s = await requireAdmin(); if (!s) return; renderAdminSidebar('admin.html');
  const { data: d, error } = await sb.rpc('admin_dashboard'); if (error) return showAlert('msg', 'danger', friendlyError(error) + ' Make sure supabase/phase6.sql has been run.');
  const C = [['Registered users', d.users, 'people', 'admin-users.html'], ['Buyers', d.buyers, 'bag', 'admin-users.html'], ['Sellers', d.sellers, 'shop', 'admin-users.html'], ['New registrations (7 days)', d.new_users, 'person-plus', 'admin-users.html'],
    ['Total products', d.products, 'box-seam', 'admin-products.html'], ['Active listings', d.active, 'check-circle', 'admin-products.html'], ['Sold products', d.sold, 'bag-check', 'admin-products.html'],
    ['Reported products', d.reported, 'flag', 'admin-reports.html'], ['Suspended users', d.suspended, 'person-slash', 'admin-users.html']];
  $('cards').innerHTML = C.map(([t, n, i, h]) => `<div class="col-6 col-md-4"><a href="${h}" class="stat d-block text-decoration-none" style="color:inherit"><i class="bi bi-${i} text-success"></i><div class="n mt-1">${n}</div><div class="text-muted-2 small">${t}</div></a></div>`).join('');
  const [r, u] = await Promise.all([
    sb.from('reports').select('id,reason,created_at,product_id,products(product_name)').eq('status', 'open').order('created_at', { ascending: false }).limit(5),
    sb.from('profiles').select('id,full_name,state,created_at').order('created_at', { ascending: false }).limit(5)]);
  $('rep').innerHTML = (r.data || []).map(x => `<div class="arow small"><strong>${esc(x.reason)}</strong> on ${esc(x.products ? x.products.product_name : 'a listing')}<div class="text-muted-2">${timeAgo(x.created_at)}</div></div>`).join('') || '<p class="text-muted-2 mb-0">No open reports. 🎉</p>';
  $('usr').innerHTML = (u.data || []).map(x => `<div class="arow small"><strong>${esc(x.full_name)}</strong> <span class="text-muted-2">${esc(x.state || '')} &middot; ${timeAgo(x.created_at)}</span></div>`).join('');
})();
</script></body></html>
