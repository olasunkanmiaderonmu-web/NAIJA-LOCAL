<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet"><title>Recently Viewed | Naija Local</title></head><body>
<div id="site-nav"></div>
<main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h2 mb-0">Recently viewed</h1><button class="btn btn-outline-secondary btn-sm d-none" id="clear" type="button">Clear history</button></div>
<div id="msg" class="alert d-none" role="alert"></div><div class="row g-3" id="grid"></div>
<div id="empty" class="text-center py-5 d-none"><i class="bi bi-clock-history fs-1 text-muted-2"></i><p class="fw-bold mb-1">Nothing viewed yet.</p><a class="btn btn-market" href="explore.html">Explore products</a></div>
</main><div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
<script>
renderNav(); renderFooter();
(async () => {
  let ids = []; try { ids = JSON.parse(localStorage.getItem('nl_recent') || '[]'); } catch (e) {}
  if (!ids.length || !ensureConfigured('msg')) return $('empty').classList.remove('d-none');
  const { data, error } = await sb.from('products').select(PRODUCT_COLS).in('id', ids);
  if (error) return showAlert('msg', 'danger', friendlyError(error));
  const byId = Object.fromEntries((data || []).map(p => [p.id, p])), list = ids.map(i => byId[i]).filter(Boolean);
  if (!list.length) return $('empty').classList.remove('d-none');
  $('grid').innerHTML = list.map(p => `<div class="col-6 col-md-4 col-lg-3">${productCard(p)}</div>`).join(''); $('clear').classList.remove('d-none');
  $('clear').onclick = () => { localStorage.removeItem('nl_recent'); $('grid').innerHTML = ''; $('clear').classList.add('d-none'); $('empty').classList.remove('d-none'); };
})();
</script></body></html>
